<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 26" width="100%" height="100%">
  <rect width="36" height="26" rx="4" fill="#f0f0f0"/>
  <clipPath id="flagRound">
    <rect width="36" height="26" rx="4"/>
  </clipPath>
  <g clip-path="url(#flagRound)">
    <!-- Saffron top stripe -->
    <rect x="0" y="0" width="36" height="8.66" fill="#ff9933"/>
    <!-- White middle stripe -->
    <rect x="0" y="8.66" width="36" height="8.66" fill="#ffffff"/>
    <!-- Green bottom stripe -->
    <rect x="0" y="17.33" width="36" height="8.67" fill="#138808"/>
    <!-- Ashoka Chakra (Navy Blue) -->
    <circle cx="18" cy="13" r="3.2" fill="none" stroke="#000080" stroke-width="0.7"/>
    <circle cx="18" cy="13" r="0.8" fill="#000080"/>
    <g stroke="#000080" stroke-width="0.35">
      <line x1="18" y1="9.8" x2="18" y2="16.2"/>
      <line x1="14.8" y1="13" x2="21.2" y2="13"/>
      <line x1="15.7" y1="10.7" x2="20.3" y2="15.3"/>
      <line x1="15.7" y1="15.3" x2="20.3" y2="10.7"/>
      <line x1="16.7" y1="9.9" x2="19.3" y2="16.1"/>
      <line x1="19.3" y1="9.9" x2="16.7" y2="16.1"/>
      <line x1="14.9" y1="14.3" x2="21.1" y2="11.7"/>
      <line x1="14.9" y1="11.7" x2="21.1" y2="14.3"/>
    </g>
  </g>
  <rect width="36" height="26" rx="4" fill="none" stroke="#000" stroke-opacity="0.1" stroke-width="1"/>
</svg>
