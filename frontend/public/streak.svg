      <stop offset="0%" stop-color="#fff159"/>
      <stop offset="60%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#ff9600"/>
    </linearGradient>
    <filter id="flameBlur" x="0" y="0" width="32" height="32" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

